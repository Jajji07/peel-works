<script>
  // This page can be shown at any broken address, so point every link and file
  // back to the site's root: "/" on your own domain, "/<repo>/" on github.io.
  (function () {
    if (location.protocol === 'file:') return;
    var first = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
    document.write('<base href="' + base + '">');
  })();
</script>

  <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="wrap lost-inner">
    <div class="lost-code" aria-label="404">
      <span>4</span>
      <div class="lost-stage">
        <div class="phone lost" id="lostPhone">
          <div class="face glass">
            <div class="layer"><div class="fill" id="lostFill"></div></div>
            <div class="cam"><div class="cam-skin" id="lostCam"></div><i></i><i></i><i></i><b></b></div>

  </div>

<script src="assets/catalog.js"></script>
<script src="assets/core.js"></script>
<script>
(() => {
  const { $, D, DESIGNS, reduced } = PW;
  const phone = $('#lostPhone');
  $('#lostPath').textContent = 'Couldn’t find: ' + decodeURIComponent(location.pathname);
  let last = null;
  function peel() {
    let d; do { d = DESIGNS[Math.floor(Math.random() * DESIGNS.length)]; } while (d === last);
    last = d;
    phone.style.setProperty('--hide', 1);
    setTimeout(() => {
      $('#lostFill').style.background = d.bg; $('#lostCam').style.background = d.bg;
      phone.style.setProperty('--hide', .42);   // stays half peeled, like the page
    }, reduced ? 0 : 450);
  }
  $('#peelAgain').addEventListener('click', peel);
  phone.addEventListener('click', peel);
  peel();
})();
</script>
