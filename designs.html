<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All designs — Peelworks</title>
<meta name="description" content="Browse every Peelworks phone skin design: circuits, Northwest, aesthetic, anime-style and minimal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23ff5b2e%27/%3E%3Cstop offset=%27.5%27 stop-color=%27%23ff3d8b%27/%3E%3Cstop offset=%271%27 stop-color=%27%237c5cff%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%2710%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="designs">

<header class="page-head">
  <div class="blobs soft"><div class="blob b1"></div><div class="blob b2"></div></div>
  <div class="wrap">
    <span class="eyebrow fade-up">The collection</span>
    <h1 class="page-title"><span class="line"><span><span id="totalCount"></span> designs.</span></span><span class="line"><span class="grad-text">Get lost.</span></span></h1>
    <p class="page-sub fade-up">Every design comes in several colorways. Tap any phone for a closer look, tilt it around, and flip through the rest with the arrows.</p>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="wrap toolbar-inner">
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="search" placeholder="Search designs, colors, vibes…" aria-label="Search designs"></label>
    <div class="chips" id="chips"></div>
    <div class="toolbar-right">
      <label class="mini-select">Sort <select id="sort"><option value="featured">Featured</option><option value="az">A–Z</option><option value="shuffle">Shuffle</option></select></label>
      <label class="mini-select">My phone <select data-model id="tbModel"></select></label>
    </div>
  </div>
</div>

<main class="gallery">
  <div class="wrap">
    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"><span class="spin dark"></span></div>
    <p class="end-note" id="endNote" hidden></p>
  </div>
</main>

<section class="packs" id="packs">
  <div class="wrap">
    <div class="section-head reveal"><div><span class="eyebrow">Extras</span><h2>Sticker packs &amp; bundles.</h2></div></div>
    <div class="grid" id="packGrid"></div>
  </div>
</section>

<button class="surprise magnetic" id="surprise"><span>✦</span> Surprise me</button>

<div class="qv" id="qv" aria-hidden="true">
  <div class="qv-backdrop" data-close></div>
  <div class="qv-panel" role="dialog" aria-modal="true" aria-labelledby="qvName">
    <button class="icon-btn qv-close" data-close aria-label="Close">&times;</button>
    <div class="qv-stage" id="qvStage">
      <div class="bobber">
        <div class="phone" id="qvPhone">
          <div class="face glass">
            <div class="layer"><div class="fill" id="qvFill"></div></div>
            <div class="cam"><div class="cam-skin" id="qvCam"></div><i></i><i></i><i></i><b></b></div>
            <div class="try-glare" id="qvGlare"></div>
          </div>
        </div>
      </div>
      <button class="qv-nav prev" id="qvPrev" aria-label="Previous design">&larr;</button>
      <button class="qv-nav next" id="qvNext" aria-label="Next design">&rarr;</button>
      <span class="qv-pos" id="qvPos"></span>
    </div>
    <div class="qv-info">
      <span class="eyebrow" id="qvTag"></span>
      <h2 id="qvName"></h2>
      <p class="qv-way" id="qvWay"></p>
      <p class="desc" id="qvDesc"></p>
      <p class="qv-label">Colorways</p>
      <div class="swatches small" id="qvWays"></div>
      <label class="field">Phone model <select data-model id="qvModel"></select></label>
      <div class="qv-buy">
        <button class="btn btn-dark" id="qvAdd">Add skin · <span id="qvPrice"></span></button>
        <button class="btn btn-light" id="qvBundle">Bundle + 5 stickers · <span id="qvBundlePrice"></span></button>
      </div>
      <a class="link-btn" id="qvStudio" href="studio.html">Open in Studio &rarr;</a>
    </div>
  </div>
</div>

<script src="assets/catalog.js"></script>
<script src="assets/core.js"></script>
<script src="assets/shop.js"></script>
</body>
</html>
