<body data-page="studio">

<section class="try studio" id="try">
  <div class="wrap try-grid">
    <div class="try-stage" id="tryStage">
      <div class="bobber">
        <div class="phone" id="tryPhone">
          <div class="face glass">
            <div class="layer"><div class="fill" id="tryBase"></div></div>
            <div class="layer"><div class="fill" id="tryNext" style="clip-path:inset(0% 0% 100% 0%)"></div></div>
            <div class="cam"><div class="cam-skin" id="tryCamBase"></div><div class="cam-skin" id="tryCamNext" style="clip-path:inset(0% 0% 100% 0%)"></div><i></i><i></i><i></i><b></b></div>
            <div class="try-glare" id="tryGlare"></div>
          </div>
        </div>
      </div>
      <span class="try-hint" id="tryHint">Move or drag to tilt</span>
    </div>
    <div class="try-panel">
      <span class="eyebrow">Studio</span>
      <h1 class="studio-name" id="tryName">Trace</h1>
      <p class="qv-way" id="tryWay"></p>
      <p class="desc" id="tryDesc"></p>
      <div class="chips small" id="studioChips"></div>
      <div class="swatch-strip" id="swatches"></div>
      <div class="custom-tools" id="customTools" hidden>
        <div class="zoom-row"><span>Zoom</span><input type="range" id="zoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom photo"><button class="link-btn" id="changePhoto" type="button">Change photo</button></div>
        <label class="rights"><input type="checkbox" id="rights"> I own this photo or have permission to use it.</label>
        <p class="res-warn" id="resWarn" hidden>Heads up: this photo is low resolution and may print blurry.</p>
      </div>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <label class="field">Phone model <select data-model id="model"></select></label>
      <div id="studioModelHelp"></div>
      <div class="try-buy"><span class="price" id="tryPrice"></span><button class="btn btn-dark magnetic" id="tryAdd">Add to cart</button><button class="btn btn-light" id="tryBundle">+ 5 stickers · <span id="tryBundlePrice"></span></button></div>
      <div id="studioTrust"></div>
    </div>
  </div>
</section>

<script src="assets/catalog.js"></script>
<script src="assets/core.js"></script>
<script src="assets/studio.js"></script>
</body>
</html>
